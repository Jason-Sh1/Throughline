[project]
name = "throughline-worker"
version = "0.1.0"
description = "Throughline ingestion + AI pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.8",
  "ruamel.yaml>=0.18",       # round-trip YAML so the AllSides import keeps feeds.yaml comments
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
