# Throughline curated feed list.
#
# Launch list: grouped by outlet, >= 25 feeds per category, spectrum-balanced
# overall. Drafted by Claude on 2026-10-25 (Jason delegated curation); Jason
# reviews the spectrum labels.
#
# allsides_rating values are best-guess placeholders until the AllSides import
# (`make allsides CSV=...`) replaces them with current ratings and fills in
# allsides_url. Non-U.S. outlets are always `not_rated`. Specialist outlets
# (tech, science, health, sports, culture trade press) are `not_rated` unless
# AllSides rates them.
#
# Ratings: AllSides Media Bias Ratings, https://www.allsides.com/media-bias,
# licensed CC BY-NC 4.0.
#
# Every URL is checked by the "Ingest smoke test" workflow, which annotates any
# feed not answering 200/304. Removed after live checks: WSJ (robots.txt
# disallows crawlers), Atlantic entertainment feed (404).
#
# Schema: worker/ingest/feeds_config.py. Validate with `make validate-feeds`
# (STRICT=1 for the launch targets).

