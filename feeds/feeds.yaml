  - slug: reason
    name: Reason
    homepage: https://reason.com
    region: US
    allsides_rating: lean_right
    feeds:
      - url: https://reason.com/feed/
        category: politics

  - slug: the-dispatch
    name: The Dispatch
    homepage: https://thedispatch.com
    region: US
    allsides_rating: lean_right
    feeds:
      - url: https://thedispatch.com/feed/
