# Live smoke test: fetch the real feeds into a throwaway database, embed with the
# real model, cluster, and print the result. Runs on PRs that touch ingestion or
# clustering, or by hand from the Actions tab. Not a required check: publishers'
# feeds go down for reasons unrelated to our code.
name: Ingest smoke test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "worker/ingest/**"
      - "worker/cluster/**"
      - "feeds/**"
      - ".github/workflows/ingest-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: throughline_smoke
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/throughline_smoke
      CRAWLER_CONTACT: https://github.com/${{ github.repository }}
      GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install worker deps (CPU-only torch)
        run: |
          cd worker && uv sync --python 3.12
          cd .. && make embed-deps
      - name: Apply migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/tests/local_auth_shim.sql
          for f in supabase/migrations/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Sync feeds
        run: make sync-sources
      - name: Fetch
        run: make fetch
      - name: Feed health
        run: |
          psql "$DATABASE_URL" -c "select s.name, f.url, f.last_status from feeds f
            join sources s on s.id = f.source_id
            where f.last_status is distinct from 200 and f.last_status is distinct from 304
            order by s.name"
          psql "$DATABASE_URL" -c "select origin, count(*), count(duplicate_of) as dupes
            from articles group by origin"
      - name: Embed and cluster
        run: make cluster
      - name: Clusters before the nightly pass
        run: |
          make -s clusters ARGS="--min-outlets 2 --limit 25 --headlines 5" | tee /tmp/online.txt
      - name: Re-cluster
        run: make recluster
      - name: Clusters with 2+ outlets
        run: make clusters ARGS="--min-outlets 2 --limit 40"
      # Same results as annotations, so they show on the PR's Checks tab without
      # opening the logs.
      - name: Report as annotations
        if: always()
        run: |
          report() {
            local level=$1 title=$2; shift 2
            local body
            body=$("$@" 2>&1 | head -c 60000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::$level title=$title::${body:-none}"
          }
          report warning "Feeds not returning 200/304" psql "$DATABASE_URL" -At -F ' | ' -c \
            "select s.name, f.url, coalesce(f.last_status::text, 'no response') from feeds f
             join sources s on s.id = f.source_id
             where f.last_status is distinct from 200 and f.last_status is distinct from 304
             order by s.name"
          report notice "Articles by origin" psql "$DATABASE_URL" -At -F ' | ' -c \
            "select origin, count(*), count(duplicate_of), count(embedding) from articles group by 1"
          report notice "Pipeline runs" psql "$DATABASE_URL" -At -F ' | ' -c \
            "select kind, status, stats::text from pipeline_runs order by id"
          report notice "Online clusters (before re-cluster)" cat /tmp/online.txt
          report notice "Clusters with 2+ outlets (after re-cluster)" make -s clusters ARGS="--min-outlets 2 --limit 25 --headlines 5"
