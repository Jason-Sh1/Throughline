name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  worker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: throughline_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_TEST_URL: postgresql://postgres:postgres@localhost:5432/throughline_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install worker deps
        run: cd worker && uv sync --python 3.12
      - name: Lint and unit tests
        run: make test-worker
      - name: Validate feeds.yaml
        run: make validate-feeds
      - name: Migrations, RLS tests, and worker tests against Postgres
        run: make db-test
      # The eval cache is content-addressed (story + prompt texts + models), so
      # restoring the newest copy is always safe; an unchanged pipeline re-scores
      # for free and only a prompt/model change pays for new LLM calls (~$1).
      - name: Restore eval cache
        uses: actions/cache/restore@v4
        with:
          path: worker/evals/.cache
          key: evals-${{ github.run_id }}
          restore-keys: evals-
      - name: Eval gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: make eval-quick
      # Saved even when the gate fails: otherwise every push of a failing change
      # would pay for the same model calls again.
      - name: Save eval cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: worker/evals/.cache
          key: evals-${{ github.run_id }}
      - name: Eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: worker/evals/results/
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: make test-web
      - run: cd web && npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
